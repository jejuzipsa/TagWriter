name: Build TagWriter
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64
        shell: pwsh
        run: dotnet publish TagWriter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TagWriter-0.0.2.5-win-x64
          path: publish/
          if-no-files-found: error
